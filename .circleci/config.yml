version: 2.1

orbs:
  tools: replikativ/clj-tools@0

executors:
  python:
    docker:
      - image: cimg/python:3.12

jobs:
  setup:
    executor: tools/clojurecli
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}
            - source-
      - checkout
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - .git
      - restore_cache:
          keys:
            - deps-{{ checksum "deps.edn" }}
            - deps-
      - run:
          name: Resolve Clojure dependencies
          command: clojure -A:test:konserve:cljs:build -P
      - save_cache:
          key: deps-{{ checksum "deps.edn" }}
          paths:
            - /home/circleci/.m2
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
            - npm-
      - run:
          name: Install JavaScript dependencies
          command: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - /home/circleci/.npm
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - .npm
            - replikativ

  format-check:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Check Clojure formatting
          command: clojure -M:format

  test-clj:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run JVM tests
          command: clojure -X:test :dirs '["test"]'
          no_output_timeout: 10m

  test-konserve:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run optional Konserve adapter tests
          command: clojure -X:konserve:test :dirs '["test" "test-konserve"]'
          no_output_timeout: 10m

  test-cljs:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Compile ClojureScript tests
          command: npx shadow-cljs compile :node-test
          no_output_timeout: 10m
      - run:
          name: Run ClojureScript tests
          command: node target/node-tests.js
          no_output_timeout: 10m

  test-python:
    executor: python
    steps:
      - checkout
      - run:
          name: Install optional secure-client dependencies
          command: python -m pip install '.[secure-client]'
      - run:
          name: Run Python protocol tests
          command: python -m unittest discover -s interop/python -v
      - run:
          name: Build Python wheel
          command: python -m pip wheel . --no-deps --wheel-dir /tmp/netz-python-dist

  build:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Build JVM artifact
          command: clojure -T:build jar

workflows:
  build-test:
    jobs:
      - setup:
          context: dockerhub-deploy
      - format-check:
          context: dockerhub-deploy
          requires: [setup]
      - test-clj:
          context: dockerhub-deploy
          requires: [setup]
      - test-konserve:
          context: dockerhub-deploy
          requires: [setup]
      - test-cljs:
          context: dockerhub-deploy
          requires: [setup]
      - test-python
      - build:
          context: dockerhub-deploy
          requires: [setup]
