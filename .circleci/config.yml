version: 2.1

orbs:
  tools: replikativ/clj-tools@0

executors:
  python:
    docker:
      - image: cimg/python:3.12

jobs:
  setup:
    executor: tools/clojurecli
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}
            - source-
      - checkout
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - .git
      - restore_cache:
          keys:
            - deps-{{ checksum "deps.edn" }}
            - deps-
      - run:
          name: Resolve Clojure dependencies
          command: |
            clojure -A:test:secure-test:konserve:cljs:build -P
            clojure -A:replica-demo:test -P
      - save_cache:
          key: deps-{{ checksum "deps.edn" }}
          paths:
            - /home/circleci/.m2
            - /home/circleci/.gitlibs
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
            - npm-
      - run:
          name: Install JavaScript dependencies
          command: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - /home/circleci/.npm
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - .gitlibs
            - .npm
            - replikativ

  format-check:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Check Clojure formatting
          command: clojure -M:format

  test-clj:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run JVM tests
          command: clojure -X:test :dirs '["test"]'
          no_output_timeout: 10m

  test-checkpoint:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Check provisioning, encrypted checkpoints and crash boundaries
          command: clojure -X:checkpoint-test :dirs '["test-checkpoint"]'
          no_output_timeout: 10m

  test-konserve:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run optional Konserve adapter tests
          command: clojure -X:konserve:test :dirs '["test" "test-konserve"]'
          no_output_timeout: 10m

  test-secure:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run secure Kabel/Noise binding tests
          command: clojure -X:secure-test :dirs '["test" "test-secure"]'
          no_output_timeout: 10m

  test-mixed:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Compile live Node content, sync, and dissemination peers
          command: clojure -M:test:secure-test:konserve:mixed-test:cljs -m shadow.cljs.devtools.cli compile mixed-content mixed-sync mixed-dissemination
          no_output_timeout: 10m
      - run:
          name: Install Python for mixed-runtime conformance
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-venv
            python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
            python3 -m venv /tmp/netz-mixed-venv
            /tmp/netz-mixed-venv/bin/python -m pip install '.[secure-client]'
      - run:
          name: Run JVM/Node/Python content, sync, dissemination, and blob tests
          command: |
            NETZ_PYTHON=/tmp/netz-mixed-venv/bin/python clojure -X:secure-test:mixed-test :dirs '["test-mixed"]'
          no_output_timeout: 10m

  test-replica:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Verify Datahike replica recovery against released dependencies
          command: clojure -X:replica-demo:test :dirs '["test-replica"]'
          no_output_timeout: 10m

  test-cljs:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Compile ClojureScript tests
          command: clojure -M:test:secure-test:konserve:cljs -m shadow.cljs.devtools.cli compile node-test
          no_output_timeout: 10m
      - run:
          name: Run ClojureScript tests
          command: node target/node-tests.js
          no_output_timeout: 10m

  test-python:
    executor: python
    steps:
      - checkout
      - run:
          name: Verify shared commit-count version
          command: |
            test "$(python build_version.py)" = "0.1.$(git rev-list --count HEAD)"
            test "$(python setup.py --version)" = "$(python build_version.py)"
      - run:
          name: Install optional secure-client dependencies
          command: python -m pip install '.[secure-client]'
      - run:
          name: Run Python protocol tests
          command: python -m unittest discover -s interop/python -v
      - run:
          name: Build Python wheel
          command: python -m pip wheel . --no-deps --wheel-dir /tmp/netz-python-dist
      - store_artifacts:
          path: /tmp/netz-python-dist
          destination: python-dist
      - run:
          name: Verify installed wheel without checkout imports
          command: |
            wheel_env=$(mktemp -d)
            python -m venv "$wheel_env"
            "$wheel_env/bin/python" -m pip install --no-deps /tmp/netz-python-dist/*.whl
            "$wheel_env/bin/python" -I interop/python/check_installed.py --core-only
            "$wheel_env/bin/python" -m pip install 'netz-protocol[secure-client]'
            "$wheel_env/bin/python" -I interop/python/check_installed.py

  build:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Verify and build JVM artifact
          command: clojure -T:build verify
      - store_artifacts:
          path: target/netz.jar
          destination: netz.jar

  deploy-python:
    executor: python
    steps:
      - checkout
      - run:
          name: Build and validate Python distribution
          command: |
            # Twine 6.1+ exchanges CircleCI's OIDC token for a short-lived
            # PyPI credential. No long-lived registry secret is required.
            python -m pip install build 'twine>=6.1'
            python -m build --wheel
            python -m twine check dist/*
      - run:
          name: Publish Python distribution
          command: python -m twine upload --non-interactive dist/*

  deploy-clojars:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Verify and publish JVM artifact
          command: clojure -T:build deploy

workflows:
  build-test:
    jobs:
      - setup:
          context: docker-deploy
      - format-check:
          context: docker-deploy
          requires: [setup]
      - test-clj:
          context: docker-deploy
          requires: [setup]
      - test-konserve:
          context: docker-deploy
          requires: [setup]
      - test-replica:
          context: docker-deploy
          requires: [setup]
      - test-secure:
          context: docker-deploy
          requires: [setup]
      - test-mixed:
          context: docker-deploy
          requires: [setup]
      - test-checkpoint:
          context: docker-deploy
          requires: [setup]
      - test-cljs:
          context: docker-deploy
          requires: [setup]
      - test-python
      - build:
          context: docker-deploy
          requires: [setup]
      - deploy-python:
          context: pypi-deploy
          filters:
            branches:
              only: main
          requires:
            - format-check
            - test-clj
            - test-konserve
            - test-replica
            - test-secure
            - test-mixed
            - test-checkpoint
            - test-cljs
            - test-python
            - build
      - deploy-clojars:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires: [deploy-python]
