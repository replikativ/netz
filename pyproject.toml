[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "netz-protocol"
version = "0.1.0a1"
description = "Dependency-free CBOR, sync, content, and durable-blob core for Netz"
readme = "interop/python/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "The Netz contributors"},
]
keywords = ["p2p", "cbor", "synchronization", "crdt", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
crypto = [
  "cryptography>=50.0.1",
]
secure-client = [
  "cryptography>=50.0.1",
  # The adapter relies on the 0.3.1 state-machine API and pins it until the
  # upstream project publishes a maintained release with remote-static access.
  "noiseprotocol==0.3.1",
  "websockets>=14,<16",
]

[project.urls]
Homepage = "https://github.com/replikativ/netz"
Repository = "https://github.com/replikativ/netz"
Specification = "https://github.com/replikativ/netz/blob/main/spec/netz-draft-00.md"
Issues = "https://github.com/replikativ/netz/issues"

[tool.setuptools]
package-dir = {"" = "interop/python"}
py-modules = ["netz_codec", "netz_sync"]

[tool.setuptools.packages.find]
where = ["interop/python"]
include = ["netz_protocol*"]

[tool.setuptools.package-data]
netz_protocol = ["py.typed"]
